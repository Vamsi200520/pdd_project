name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    name: API-100 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r asthma-backend/requirements.txt
          pip install pytest fastapi httpx python-dotenv passlib bcrypt==3.2.2 python-multipart email-validator "python-jose[cryptography]"

      - name: Run 100 API Tests
        run: |
          pytest tests/test_api.py -v

  selenium-tests:
    name: Selenium-300 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium and Pytest
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest

      - name: Run 300 Selenium Web Tests
        run: |
          pytest tests/test_selenium.py -v

  appium-tests:
    name: Appium-300 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run 300 Appium Mobile Tests
        run: |
          pytest tests/test_appium.py -v

  vulnerability-scan:
    name: Vulnerability-100 Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Scanner Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Vulnerability Scan
        run: |
          python tests/vulnerability_scan.py

      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: reports/vulnerability_report.json

  load-tests:
    name: Load-300 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r asthma-backend/requirements.txt
          pip install pytest fastapi httpx python-dotenv passlib bcrypt==3.2.2 python-multipart email-validator "python-jose[cryptography]"

      - name: Run 300 Load Tests
        run: |
          pytest tests/test_load.py -v

  threshold-check:
    name: Threshold-100 Check
    runs-on: ubuntu-latest
    needs: [api-tests, selenium-tests, appium-tests, vulnerability-scan, load-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Scan Report
        uses: actions/download-artifact@v4
        with:
          name: vulnerability-report
          path: reports

      - name: Run Quality Gate Check
        run: |
          python tests/threshold_check.py
